[package]
name = "odm-core"
description = "Download engine for odm: jobs, queue, persistence and the HTTP backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
md-5 = "0.10.6"
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.6"
sha2 = "0.10.8"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[lints]
workspace = true
