[package]
name = "odm-core"
description = "Download engine for odm: jobs, queue, persistence and the HTTP backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"

[lints]
workspace = true
