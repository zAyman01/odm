[package]
name = "odm-cli"
description = "Command-line client for the odm daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "odm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
odm-api = { path = "../odm-api" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
axum = "0.8.9"
odm-daemon = { path = "../odm-daemon" }
tempfile = "3.27.0"

[lints]
workspace = true
