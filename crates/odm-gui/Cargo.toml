[package]
name = "odm-gui"
description = "Desktop client for the odm daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "odm_gui"
path = "src/lib.rs"

[[bin]]
name = "odm-gui"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
odm-api = { path = "../odm-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
