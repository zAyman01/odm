[package]
name = "odm-gui"
description = "Desktop client for the odm daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "odm_gui"
path = "src/lib.rs"

[[bin]]
name = "odm-gui"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
directories = "6.0.0"
futures-util = "0.3.34"
notify-rust = { version = "4.19.0", default-features = false }
odm-api = { path = "../odm-api" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-pki-types"] }
url = "2.5.8"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tempfile = "3.27.0"

[lints]
workspace = true
