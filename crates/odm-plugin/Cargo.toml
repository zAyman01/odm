[package]
name = "odm-plugin"
description = "External-process plugin host for odm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "sync"] }
toml = "0.8.20"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
