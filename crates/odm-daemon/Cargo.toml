[package]
name = "odm-daemon"
description = "The odm background service: REST and WebSocket API over the download engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "odm_daemon"
path = "src/lib.rs"

[[bin]]
name = "odm-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "tokio", "http1", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fastrand = "2.5.0"
futures-util = "0.3.34"
odm-api = { path = "../odm-api" }
odm-core = { path = "../odm-core" }
odm-media = { path = "../odm-media" }
odm-plugin = { path = "../odm-plugin" }
odm-torrent = { path = "../odm-torrent" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.29.0"

[lints]
workspace = true
