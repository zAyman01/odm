[package]
name = "odm-media"
description = "HLS, DASH and yt-dlp backends for odm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.9.4"
async-trait = "0.1.92"
cbc = { version = "0.2.1", features = ["alloc"] }
dash-mpd = { version = "0.21.0", default-features = false }
m3u8-rs = "6.0.1"
odm-core = { path = "../odm-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
sha2 = "0.10.8"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util", "macros"] }

[lints]
workspace = true
