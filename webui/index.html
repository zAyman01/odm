<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>odm</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --border-color: #2e2e38;
      --text-color: #e1e1e6;
      --text-muted: #8d8d99;
      --primary: #4a9eff;
      --primary-hover: #3385e0;
      --danger: #f75a68;
      --danger-hover: #e04856;
      --success: #04d361;
      --warning: #ffbb00;
      --input-bg: #18181c;
      --header-bg: #18181c;
      --row-hover: #26262e;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f0f2f5;
        --card-bg: #ffffff;
        --border-color: #dcdce6;
        --text-color: #1f2029;
        --text-muted: #6c6f7e;
        --primary: #0066cc;
        --primary-hover: #0052a3;
        --danger: #d9383a;
        --danger-hover: #b82b2d;
        --success: #1b873f;
        --warning: #d97706;
        --input-bg: #f8f9fa;
        --header-bg: #ffffff;
        --row-hover: #f4f5f8;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--primary);
    }

    .brand .version {
      font-size: 0.75rem;
      background-color: var(--border-color);
      color: var(--text-muted);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
      display: inline-block;
      transition: background-color 0.3s ease;
    }

    .status-dot.connected {
      background-color: var(--success);
    }

    .btn {
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: #fff;
    }

    .btn-outline {
      background-color: transparent;
      color: var(--text-color);
      border-color: var(--border-color);
    }

    .btn-outline:hover {
      background-color: var(--row-hover);
    }

    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Auth Screen */
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 60vh;
    }

    .auth-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .auth-card h2 {
      margin-bottom: 0.5rem;
      font-size: 1.25rem;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      padding: 0.6rem 0.75rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 0.875rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      padding: 1.5rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-header h3 {
      font-size: 1.1rem;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    /* Downloads Table */
    .table-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th {
      padding: 0.85rem 1rem;
      background-color: var(--header-bg);
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: var(--row-hover);
    }

    .filename-cell {
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .progress-bar-container {
      width: 100%;
      min-width: 120px;
      max-width: 180px;
      height: 8px;
      background-color: var(--input-bg);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.25rem;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background-color: var(--primary);
      transition: width 0.2s ease;
    }

    .progress-bar.completed { background-color: var(--success); }
    .progress-bar.paused { background-color: var(--warning); }
    .progress-bar.failed { background-color: var(--danger); }

    .progress-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .state-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .state-downloading { background-color: rgba(74, 158, 255, 0.2); color: var(--primary); }
    .state-completed { background-color: rgba(4, 211, 97, 0.2); color: var(--success); }
    .state-paused { background-color: rgba(255, 187, 0, 0.2); color: var(--warning); }
    .state-failed { background-color: rgba(247, 90, 104, 0.2); color: var(--danger); }
    .state-queued { background-color: rgba(141, 141, 153, 0.2); color: var(--text-muted); }
    .state-probing { background-color: rgba(74, 158, 255, 0.2); color: var(--primary); }
    .state-verifying { background-color: rgba(255, 187, 0, 0.2); color: var(--warning); }
    .state-seeding { background-color: rgba(4, 211, 97, 0.2); color: var(--success); }
    .state-cancelled { background-color: rgba(141, 141, 153, 0.2); color: var(--text-muted); }

    .action-buttons {
      display: flex;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-muted);
    }

    /* Mobile Responsive Card Layout */
    @media (max-width: 650px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 1rem;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.75rem;
      }

      td {
        border-bottom: none;
        padding: 0.4rem 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      td::before {
        content: attr(data-label);
        font-weight: 600;
        color: var(--text-muted);
        font-size: 0.75rem;
      }

      .filename-cell {
        max-width: 100%;
        margin-bottom: 0.25rem;
      }

      .progress-bar-container {
        max-width: 100%;
        min-width: 150px;
      }

      .action-buttons {
        width: 100%;
        justify-content: flex-end;
        margin-top: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--border-color);
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <h1>odm</h1>
      <span class="version" id="appVersion">v0.1.0</span>
      <span class="status-dot" id="wsStatus" title="Disconnected"></span>
    </div>
    <div class="header-actions" id="headerActions" style="display: none;">
      <button class="btn btn-primary" id="openAddModalBtn">+ Add URL</button>
      <button class="btn btn-outline" id="disconnectBtn">Disconnect</button>
    </div>
  </header>

  <main>
    <!-- Auth Screen -->
    <div class="auth-container" id="authSection">
      <div class="auth-card">
        <h2>Connect to odm</h2>
        <p>Enter the authorization token found in your daemon's config directory.</p>
        <form id="authForm">
          <div class="form-group">
            <label for="tokenInput">Bearer Token</label>
            <input type="password" id="tokenInput" class="form-control" placeholder="Paste token here" required autofocus autocomplete="current-password">
            <div class="error-msg" id="authError">Invalid token or connection failed</div>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Connect</button>
        </form>
      </div>
    </div>

    <!-- Downloads Section -->
    <div id="downloadsSection" style="display: none;">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Filename</th>
              <th>Size</th>
              <th>Progress</th>
              <th>Speed</th>
              <th>State</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="downloadsTableBody">
            <tr>
              <td colspan="6" class="empty-state">No downloads yet</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add URL Modal -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add Download</h3>
        <button class="btn btn-outline btn-sm" id="closeAddModalBtn" style="border:none; font-size:1.2rem;">&times;</button>
      </div>
      <form id="addDownloadForm">
        <div class="form-group">
          <label for="downloadUrlInput">URL or Magnet Link</label>
          <input type="text" id="downloadUrlInput" class="form-control" placeholder="https://... or magnet:?..." required>
          <div class="error-msg" id="addError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="cancelAddBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitAddBtn">Start Download</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
